<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Farm Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=1790196288231">
    <link rel="stylesheet" href="css/auth.css?v=1790196288231">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="app-title">Farm Manager</h1>
            <p class="tagline">Manage your herd, track your success.</p>
            
            <div id="errorMessage" class="error-text"></div>
            
            <button type="button" id="btnGoogleSignIn" class="btn-primary full-width" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px; font-size: 1.1rem;">
                <i class="fab fa-google" style="font-size: 1.3rem;"></i>
                Sign in with Google
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js?v=1790196288231"></script>
    <script src="js/login.js?v=1790196288231"></script>
</body>
</html>
