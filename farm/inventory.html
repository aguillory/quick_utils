<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Farm Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=1790198947651">
    <style>
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .inventory-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 1rem;
        }
        .qty-controls button {
            padding: 5px 12px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 4px;
        }
        .qty-input {
            width: 80px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="global-nav"></div>

    <main class="container">
        <header class="page-header flex-between">
            <h1><i class="fas fa-boxes"></i> Feed & Supply Inventory</h1>
            <button class="btn-primary" id="btnNewItem"><i class="fas fa-plus"></i> Add New Item</button>
        </header>

        <div id="inventoryList" class="inventory-grid">
            <div style="text-align:center; padding: 2rem; color: #666; grid-column: 1 / -1;">
                Loading inventory...
            </div>
        </div>
    </main>

    <!-- Modal for New Item -->
    <div id="itemModal" class="modal">
        <div class="modal-content" style="max-width: 400px;">
            <span class="modal-close" data-modal="itemModal">&times;</span>
            <h2 id="itemModalTitle">Add Inventory Item</h2>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                <div class="form-group">
                    <label>Item Name *</label>
                    <input type="text" id="itemName" placeholder="e.g. Alfalfa Bales, Goat Grain" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="itemCategory">
                        <option value="Feed">Feed</option>
                        <option value="Bedding">Bedding</option>
                        <option value="Medical">Medical / Supplements</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Current Quantity</label>
                        <input type="number" id="itemQty" step="0.01" value="0" required>
                    </div>
                    <div class="form-group">
                        <label>Unit</label>
                        <input type="text" id="itemUnit" placeholder="e.g. bags, bales, mice" required>
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <label><input type="checkbox" id="itemLowAlertToggle"> Alert when low</label>
                </div>
                <div class="form-group" id="itemLowAlertGroup" style="display:none;">
                    <label>Alert Threshold</label>
                    <input type="number" id="itemThreshold" step="0.01" value="5">
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" data-modal="itemModal">Cancel</button>
                    <button type="submit" class="btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js?v=1790198947651"></script>
    <script src="js/shared.js?v=1790198947651"></script>
    <script src="js/nav.js?v=1790198947651"></script>
    <script src="js/inventory.js?v=1790198947651"></script>
</body>
</html>
