<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breeding Dashboard - Farm Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css?v=1790198947651">
    <style>
        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .status-Exposed { background: #FF9800; }
        .status-Pregnant { background: #4CAF50; }
        .date-alert { color: #f44336; font-weight: bold; }
        .date-soon { color: #FF9800; font-weight: bold; }
    </style>
</head>
<body>
    <div id="global-nav"></div>

    <main class="container">
        <header class="page-header flex-between">
            <h1><i class="fas fa-venus-mars"></i> Breeding Dashboard</h1>
        </header>

        <div style="margin-top: 1rem; margin-bottom: 2rem;">
            <h3>Active Pregnancies & Exposures</h3>
            <div id="breedingList" class="grid-dashboard">
                <div style="text-align:center; padding: 2rem; color: #666; grid-column: 1 / -1;">
                    Loading active breeding records...
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js?v=1790198947651"></script>
    <script src="js/shared.js?v=1790198947651"></script>
    <script src="js/nav.js?v=1790198947651"></script>
    <script src="js/breeding.js?v=1790198947651"></script>
</body>
</html>
