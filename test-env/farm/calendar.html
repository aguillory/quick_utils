<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Farm Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .calendar-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .calendar-controls button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .calendar-wrapper {
            width: 100%;
            overflow-x: auto;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #e0e0e0;
            border: 1px solid #e0e0e0;
            min-width: 700px;
        }
        .calendar-day-header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: 600;
        }
        .calendar-day {
            background: white;
            min-height: 120px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .calendar-day.other-month {
            background: #f9f9f9;
            color: #aaa;
        }
        .calendar-day.today {
            background: #e8f5e9;
        }
        .day-number {
            font-weight: 600;
            margin-bottom: 5px;
            display: inline-block;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }
        .calendar-task {
            background: var(--secondary-color);
            color: white;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .calendar-task.completed {
            background: #aaa;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div id="global-nav"></div>

    <main class="container">
        <div class="calendar-header">
            <div>
                <h1 id="monthYearDisplay">Month Year</h1>
            </div>
            <div class="calendar-controls">
                <button id="btnPrevMonth"><i class="fas fa-chevron-left"></i></button>
                <button id="btnToday">Today</button>
                <button id="btnNextMonth"><i class="fas fa-chevron-right"></i></button>
                
                <button id="btnSyncGoogle" class="btn-secondary" style="margin-left: 1rem; background: white; color: #333; border: 1px solid #ccc;">
                    <i class="fab fa-google" style="margin-right: 5px;"></i>
                    Sync to Google Calendar
                </button>
            </div>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
            <div class="calendar-wrapper">
                <div class="calendar-grid" id="calendarGrid">
                    <!-- Headers -->
                    <div class="calendar-day-header">Sun</div>
                    <div class="calendar-day-header">Mon</div>
                    <div class="calendar-day-header">Tue</div>
                    <div class="calendar-day-header">Wed</div>
                    <div class="calendar-day-header">Thu</div>
                    <div class="calendar-day-header">Fri</div>
                    <div class="calendar-day-header">Sat</div>
                    <!-- Days will be generated by JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Task Details Modal -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" data-modal="taskModal">&times;</span>
            <h2 id="taskModalTitle">Task Details</h2>
            <div class="form-group mt-1">
                <p><strong>Animal:</strong> <span id="taskAnimalName"></span></p>
                <p><strong>Treatment:</strong> <span id="taskTreatment"></span></p>
                <p><strong>Date:</strong> <span id="taskDate"></span></p>
                <p><strong>Notes:</strong> <span id="taskNotes"></span></p>
                <p><strong>Status:</strong> <span id="taskStatus"></span></p>
            </div>
            <div class="modal-footer" style="margin-top: 1.5rem;">
                <button type="button" class="btn-cancel" data-modal="taskModal">Close</button>
                <button type="button" class="btn-primary" id="btnMarkComplete">Mark Complete</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    
    <!-- Config -->
    <script src="js/firebase-config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/calendar.js"></script>
</body>
</html>
