<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Audit Log</title>
<link rel="stylesheet" href="nipto-shared.css">
<style>
    body { align-items: flex-start; }
    .admin-wrap { width: 100%; max-width: 1100px; margin: 0 auto; }
    .admin-card {
        background: var(--card-bg); border: 1px solid var(--border-color);
        border-radius: 16px; padding: 20px; margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .admin-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .admin-bar input[type="text"] {
        flex: 1; min-width: 200px; padding: 10px; font-size: 14px;
        border: 2px solid var(--border-color); border-radius: 8px;
        background: var(--bg-color); color: var(--text-main);
    }
    .pill { padding: 8px 14px; border-radius: 999px; border: 2px solid var(--border-color);
            background: var(--card-bg); color: var(--text-main); font-weight: 700;
            font-size: 13px; cursor: pointer; }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .stat { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .msg-card { border: 1px solid var(--border-color); border-left: 6px solid var(--text-muted);
                border-radius: 12px; padding: 14px; margin-bottom: 14px; background: var(--card-bg); }
    .msg-card.is-deleted { border-left-color: var(--danger); background: rgba(239,68,68,0.04); }
    .msg-card.is-edited  { border-left-color: var(--primary); }
    .msg-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .msg-sender { font-weight: 800; font-size: 15px; }
    .msg-when { font-size: 12px; color: var(--text-muted); }
    .tag { display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase;
           letter-spacing: .5px; padding: 3px 8px; border-radius: 999px; margin-left: 6px; color: #fff; }
    .tag.del { background: var(--danger); }
    .tag.edit { background: var(--primary); }
    .msg-text { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--bg-color);
                white-space: pre-wrap; word-break: break-word; font-size: 15px; }
    .msg-text.struck { text-decoration: line-through; opacity: .75; }
    .hist { margin-top: 12px; border-top: 1px dashed var(--border-color); padding-top: 10px; }
    .hist h5 { margin: 0 0 8px 0; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }
    .hist-row { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--bg-color);
                margin-bottom: 6px; border-left: 3px solid var(--border-color); }
    .hist-meta { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .hist-text { white-space: pre-wrap; word-break: break-word; }
    .row-actions { margin-top: 10px; display: flex; gap: 8px; }
    code.uid { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="admin-wrap">
    <div class="admin-card">
        <h2 style="margin:0 0 6px 0;">🕵️ Chat Audit Log</h2>
        <p class="stat" style="margin:0 0 14px 0;">
            Every deleted or edited message, with its full version history. Nothing is ever really deleted.
        </p>
        <div class="admin-bar">
            <button class="pill active" id="f-flagged" onclick="setFilter('flagged')">🚩 Deleted or Edited</button>
            <button class="pill" id="f-deleted" onclick="setFilter('deleted')">🗑️ Deleted only</button>
            <button class="pill" id="f-edited" onclick="setFilter('edited')">✏️ Edited only</button>
            <button class="pill" id="f-all" onclick="setFilter('all')">📜 All messages</button>
            <input type="text" id="search" placeholder="Search text or sender…" oninput="render()">
            <button class="pill" onclick="exportJson()">⬇️ Export JSON</button>
        </div>
        <div class="stat" id="stats" style="margin-top:12px;">Loading…</div>
    </div>
    <div id="list"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
<script>
let ALL = [];
let filter = 'flagged';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ms(v, fb){ if(!v) return fb||0; if(typeof v==='number') return v;
    if(typeof v.toMillis==='function') return v.toMillis();
    if(v.seconds) return v.seconds*1000; return fb||0; }
function fmt(t){ return t ? new Date(t).toLocaleString() : '—'; }
function setFilter(f){
    filter = f;
    ['flagged','deleted','edited','all'].forEach(k =>
        document.getElementById('f-'+k).classList.toggle('active', k===f));
    render();
}
function render(){
    const q = (document.getElementById('search').value || '').toLowerCase().trim();
    const rows = ALL.filter(m => {
        if (filter === 'deleted' && !m.deleted) return false;
        if (filter === 'edited'  && !m.edited)  return false;
        if (filter === 'flagged' && !m.deleted && !m.edited) return false;
        if (!q) return true;
        const hay = [m.senderName, m.text, m.originalText,
            ...(m.history||[]).map(h => h.text)].join(' ').toLowerCase();
        return hay.includes(q);
    });
    document.getElementById('stats').textContent =
        `${ALL.length} total messages • ${ALL.filter(m=>m.deleted).length} deleted • ` +
        `${ALL.filter(m=>m.edited).length} edited • showing ${rows.length}`;
    const list = document.getElementById('list');
    if (!rows.length) {
        list.innerHTML = '<div class="admin-card" style="text-align:center;color:var(--text-muted);font-style:italic;">Nothing to show. 🎉</div>';
        return;
    }
    list.innerHTML = rows.map(m => {
        const hist = (m.history || []).slice().sort((a,b) =>
            new Date(a.at||0) - new Date(b.at||0));
        const histHtml = hist.length ? `
            <div class="hist">
                <h5>Version history (oldest first)</h5>
                <div class="hist-row">
                    <div class="hist-meta">V1 · ORIGINAL · ${esc(m.senderName)} · ${esc(fmt(m.createdTs))}</div>
                    <div class="hist-text">${esc(m.originalText || hist[0].text || m.text)}</div>
                </div>
                ${hist.map((h,i) => `
                    <div class="hist-row" style="border-left-color:${h.action==='deleted'?'var(--danger)':'var(--primary)'};">
                        <div class="hist-meta">
                            ${h.action === 'deleted' ? '🗑️ DELETED' : '✏️ EDITED'}
                            by ${esc(h.byName || 'Unknown')} · ${esc(fmt(new Date(h.at).getTime()))}
                            — text at that moment was:
                        </div>
                        <div class="hist-text">${esc(h.text)}</div>
                    </div>`).join('')}
                <div class="hist-row" style="border-left-color:var(--success);">
                    <div class="hist-meta">CURRENT STORED TEXT ${m.deleted ? '(hidden from chat)' : '(shown in chat)'}</div>
                    <div class="hist-text">${esc(m.text)}</div>
                </div>
            </div>` : '';
        return `
        <div class="msg-card ${m.deleted ? 'is-deleted' : (m.edited ? 'is-edited' : '')}">
            <div class="msg-top">
                <div>
                    <span class="msg-sender">${esc(m.senderName)}</span>
                    ${m.deleted ? '<span class="tag del">deleted</span>' : ''}
                    ${m.edited ? '<span class="tag edit">edited</span>' : ''}
                </div>
                <div class="msg-when">sent ${esc(fmt(m.createdTs))} &nbsp;·&nbsp; <code class="uid">${esc(m.id)}</code></div>
            </div>
            <div class="msg-text ${m.deleted ? 'struck' : ''}">${esc(m.text)}</div>
            ${m.deleted ? `<div class="msg-when" style="margin-top:6px;">
                🗑️ Removed by <strong>${esc(m.deletedByName || 'Unknown')}</strong> on ${esc(fmt(m.deletedTs))}
            </div>` : ''}
            ${m.edited && !m.deleted ? `<div class="msg-when" style="margin-top:6px;">
                ✏️ Last edited ${esc(fmt(m.editedTs))} · ${ (m.history||[]).filter(h=>h.action==='edited').length } edit(s)
            </div>` : ''}
            ${histHtml}
            ${m.deleted ? `<div class="row-actions">
                <button class="pill" onclick="restore('${m.id}')">↩️ Restore to chat</button>
            </div>` : ''}
        </div>`;
    }).join('');
}
async function restore(id){
    if (!confirm('Put this message back in the chat?')) return;
    await window.db.collection('chat_messages').doc(id).update({
        deleted: false,
        restoredAt: firebase.firestore.FieldValue.serverTimestamp(),
        history: firebase.firestore.FieldValue.arrayUnion({
            action: 'restored', text: '(restored by parent)',
            at: new Date().toISOString(), byId: 'admin', byName: 'Parent (admin page)'
        })
    });
}
function exportJson(){
    const blob = new Blob([JSON.stringify(ALL, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'chat-log-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
}
firebase.auth().signInAnonymously().then(() => {
    window.db.collection('chat_messages')
        .orderBy('createdAtMs', 'desc')
        .onSnapshot(snap => {
            ALL = [];
            snap.forEach(doc => {
                const d = doc.data() || {};
                ALL.push({
                    id: doc.id,
                    senderId: d.senderId || '',
                    senderName: d.senderName || d.senderId || 'Unknown',
                    text: d.text || '',
                    originalText: d.originalText || '',
                    deleted: !!d.deleted,
                    edited: !!d.edited,
                    deletedByName: d.deletedByName || '',
                    history: d.history || [],
                    createdTs: ms(d.createdAt, d.createdAtMs),
                    editedTs:  ms(d.editedAt,  d.editedAtMs),
                    deletedTs: ms(d.deletedAt, d.deletedAtMs)
                });
            });
            render();
        }, err => {
            document.getElementById('stats').textContent = 'Error: ' + err.message;
        });
}).catch(e => {
    document.getElementById('stats').textContent = 'Auth error: ' + e.message;
});
window.setFilter = setFilter; window.render = render;
window.restore = restore; window.exportJson = exportJson;
</script>
</body>
</html>
