<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker History</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <nav class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <a href="index.html" class="text-indigo-200 hover:text-white"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold">History</h1>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        
        <div id="history-container" class="space-y-4">
            <div class="text-center text-slate-400 py-10">Loading history...</div>
        </div>

    </main>

    <script type="module" src="js/history.js"></script>
</body>
</html>
