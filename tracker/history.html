<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker History</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-10">

    <nav class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <a href="index.html" class="text-indigo-200 hover:text-white"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold">History</h1>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-4 space-y-4">
        
        <!-- Daily View Card -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <label for="filter-date" class="block font-bold text-indigo-700 text-sm mb-2"><i class="fas fa-calendar-day mr-2"></i>Daily View</label>
            <p class="text-xs text-slate-500 mb-3">Select a date to view all logs from that specific day.</p>
            <div class="flex gap-2">
                <input type="date" id="filter-date" class="flex-grow border rounded-lg p-2 text-sm text-slate-600 focus:ring focus:ring-indigo-200">
                <button id="filter-btn" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700">Filter</button>
                <button id="clear-btn" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-bold hover:bg-slate-300">Clear</button>
            </div>
            
            <div id="daily-summary" class="mt-4 pt-4 border-t hidden">
                <h3 class="font-bold text-slate-700 text-sm mb-2">Daily Summary</h3>
                <div id="daily-summary-content" class="text-sm text-slate-600 space-y-1"></div>
            </div>
        </div>

        <div id="history-container" class="space-y-4">
            <div class="text-center text-slate-400 py-10"><i class="fas fa-spinner fa-spin mr-2"></i>Loading history...</div>
        </div>

    </main>

    <script type="module" src="js/history.js"></script>
</body>
</html>
